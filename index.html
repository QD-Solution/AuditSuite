<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trợ lý Kiểm toán — Đang hoạt động</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F5F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: #0F1B2D;
  }
  .box {
    text-align: center;
    padding: 40px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
  }
  p {
    color: #5B6472;
    font-size: 0.95rem;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3D7A5C;
    display: inline-block;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1><span class="dot"></span>Trang đang hoạt động</h1>
    <p>Nếu bạn thấy trang này, liên kết GitHub Pages đã hoạt động bình thường.</p>
  </div>
</body>
</html>
